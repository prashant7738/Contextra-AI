[project]
name = "backend"
version = "0.1.0"
description = "Contextra AI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.4",
    "bcrypt>=4.2.0",
    "fastapi>=0.136.1",
    "httpx>=0.27.0",
    "numpy>=2.4.6",
    "openai>=1.60.0",
    "pgvector>=0.3.0",
    "pillow>=10.0.0",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.1",
    "pymupdf>=1.27.2.3",
    "python-dotenv>=1.2.2",
    "pyjwt>=2.10.0",
    "python-multipart>=0.0.27",
    "sqlalchemy>=2.0.49",
    "uvicorn>=0.46.0",
]

[project.optional-dependencies]
ocr = ["easyocr>=1.7.0"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
